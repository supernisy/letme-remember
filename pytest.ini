[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: 单元测试（纯逻辑，零外部依赖，毫秒级）
    integration: 集成测试（模块协作，真实 SQLite/文件系统，秒级）
    e2e: 端到端测试（真实命令全流程，subprocess，分钟级）

addopts = -ra

# 覆盖率门禁（testing capability 要求）：domain/service 核心层 ≥80%。
# 已达标：store 89%、index 89%、redaction 92%、frontmatter 91%、
#         tokenizer 96%、validate 82%、schema 100%、distill 100%。
# 待补死角（不在 domain/service 门禁内，另行记录）：
#         cli.py 40%（命令分发层）、serve.py 0%（常驻服务，需独立进程测试）、
#         llm.py 39%（网络边界，走 mock）。
